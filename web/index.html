<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpatialDDS Demo - Cesium Option C</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div id="modeRow">
          <span id="modeBadge" data-mode="mock">Mock Mode</span>
        </div>
        <div id="controls">
          <button id="btnLocalize" type="button">Localize (Mock VPS)</button>
          <span id="framePick" hidden>
            <select id="frameSelect" title="Which photograph to send to the VPS"></select>
            <span id="framePreviewBox"><img id="framePreview" alt="selected query frame" /></span>
          </span>
          <button id="btnLocalizeImage" type="button" title="Send the selected photograph to the VPS">Localize with Image</button>
          <button id="btnDiscover" type="button">Discover Content (Mock Catalog)</button>
          <button id="btnToggleTiles" type="button">Photorealistic 3D Tiles: On</button>
          <button id="btnToggleDdsOverlay" type="button">DDS Messages: Off</button>
          <button id="btnToggleRestOverlay" type="button">REST Messages: Off</button>
          <button id="btnClear" type="button">Clear</button>
        </div>
        <pre id="readout">status: idle</pre>
      </div>
      <div id="hud" role="note" title="Click to dismiss — press ? to bring it back">
        <div>Click map to focus</div>
        <div>Mouse drag to look</div>
        <div>WASD move</div>
        <div>Arrows rotate</div>
        <div>Q/E up/down</div>
        <div id="hudDismiss">click to dismiss &middot; ? to restore</div>
      </div>
      <div id="restOverlay" class="overlay hidden">
        <div id="restOverlayHeader">REST Messages (browser &rarr; bridge)</div>
        <pre id="restOverlayBody"></pre>
      </div>
      <div id="ddsOverlay" class="overlay hidden">
        <div id="ddsOverlayHeader">DDS Messages (on the bus)</div>
        <pre id="ddsOverlayBody"></pre>
      </div>
      <div id="cesiumContainer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
