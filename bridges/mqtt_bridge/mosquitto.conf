# Mosquitto config for local development.
# Anonymous access on 1883 (TCP) and 9001 (WebSockets) — DO NOT use in
# production. Real deployments should set authentication + TLS, or run
# against AWS IoT Core (see README).

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# Persistence off — every restart starts fresh.
persistence false
log_dest stdout
